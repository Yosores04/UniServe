services:
  - type: web
    name: uniserve-pilot
    runtime: node
    branch: deploy/cloud-pilot
    region: singapore
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run cloud:build
    startCommand: npm run cloud:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: uniserve-pilot-db
          property: connectionString
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: uniserve-pilot-db
    region: singapore
    plan: free
    ipAllowList: []
